name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - run: npm ci

      # server and client import @popcorn/shared as a package, resolved via its compiled
      # dist/ output (not source) -- without this, typecheck/test/build fail with "Cannot
      # find module '@popcorn/shared'".
      - name: Build shared package
        run: npm run build -w shared

      # Server code imports the generated Prisma client's model types; without this,
      # typecheck/build fail even though no database connection is needed to generate it.
      - name: Generate Prisma Client
        run: npm run prisma:generate -w server

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
